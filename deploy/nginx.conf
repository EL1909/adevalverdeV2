# /etc/nginx/sites-available/adevalverdeV2
#
# Staging en v2.adelavalverde.info. En el corte se cambia server_name a
# adelavalverde.info www.adelavalverde.info (y el sitio viejo pasa a
# old.adelavalverde.info). Certificado:
#   sudo certbot --nginx -d v2.adelavalverde.info
# certbot añade el bloque 443 y la redirección desde el 80.

server {
    listen 80;
    server_name v2.adelavalverde.info;

    client_max_body_size 50M;   # PDFs y portadas desde el panel

    # Staging: fuera de buscadores. Quitar en el corte.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location /api/ {
        proxy_pass http://127.0.0.1:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /admin/ {
        proxy_pass http://127.0.0.1:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /home/efrain19091/projects/adevalverdeV2/adevalverdeV2/backend/static_root/;
    }

    # PDFs que se venden y comprobantes de pago: solo por la API.
    location ~ ^/media/.*/private/ {
        deny all;
    }
    location /media/ {
        alias /home/efrain19091/projects/adevalverdeV2/adevalverdeV2/backend/media/;
    }

    # El service worker y el index nunca en caché: si no, una versión nueva
    # del sitio tarda en llegar a quien tiene la PWA instalada.
    location = /sw.js {
        root /home/efrain19091/projects/adevalverdeV2/adevalverdeV2/frontend/dist;
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location = /index.html {
        root /home/efrain19091/projects/adevalverdeV2/adevalverdeV2/frontend/dist;
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    # Los assets llevan hash en el nombre: caché larga.
    location /assets/ {
        root /home/efrain19091/projects/adevalverdeV2/adevalverdeV2/frontend/dist;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # SPA: cualquier otra ruta la resuelve React.
    location / {
        root /home/efrain19091/projects/adevalverdeV2/adevalverdeV2/frontend/dist;
        try_files $uri /index.html;
    }
}
